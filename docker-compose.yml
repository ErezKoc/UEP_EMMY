services:
  backend:
    build:
      context: ./backend
    # Local secrets stay outside Git and outside the built image.  The file is
    # optional so a fresh clone still starts with the safe outbox fallback;
    # teammates who receive backend/.env automatically get real SMTP delivery.
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - backend_db:/data
    environment:
      - DATABASE_URL=sqlite:////data/uep_emmy.db
      - STORAGE_ROOT=/data/storage
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_db:
