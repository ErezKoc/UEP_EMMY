services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend_db:/data
    environment:
      - DATABASE_URL=sqlite:////data/uep_emmy.db
      - STORAGE_ROOT=/data/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_db:
