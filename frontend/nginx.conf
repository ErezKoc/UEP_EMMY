server {
    listen 80;

    # Longer than the browser's own idle-socket timeout, and deliberately so.
    #
    # nginx defaults to 75s. Chrome keeps an idle keep-alive socket for around
    # 300s, which leaves a ~225s window in which the browser will happily reuse
    # a connection nginx has already decided to close. Usually the FIN arrives
    # first and the browser opens a new one; when the close and the request
    # cross in flight, the request is discarded and the browser waits for a
    # response that is never coming. Nothing reaches nginx, so nothing appears
    # in any log here or in the backend - which is exactly the shape of the
    # stall seen when deleting an analysis and landing on the history page.
    #
    # Setting this above the client's timeout means the CLIENT always closes
    # first, and the race has no window to happen in.
    keepalive_timeout 600s;

    # Always fetch the current HTML shell after a container rebuild. Its asset
    # filenames change on every production build.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Vite fingerprints built assets, so existing files can be cached forever.
    # A missing old asset must be a 404 rather than the React HTML fallback.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve static files and fall back to the React entry point for app routes.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Proxy /v1 API requests to the backend container
    location /v1/ {
        proxy_pass http://backend:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /media requests to the backend container
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
